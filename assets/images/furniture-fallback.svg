<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">FurniFlex furniture preview</title>
  <desc id="desc">A warm, neutral illustration of a small coordinated furniture collection used while a product preview loads.</desc>
  <defs>
    <linearGradient id="wall" x2="0" y2="1"><stop stop-color="#f6f0e7"/><stop offset="1" stop-color="#eee5d8"/></linearGradient>
    <linearGradient id="wood" x2="0" y2="1"><stop stop-color="#b78c63"/><stop offset="1" stop-color="#8c6346"/></linearGradient>
    <linearGradient id="fabric" x2="0" y2="1"><stop stop-color="#cbb9a3"/><stop offset="1" stop-color="#aa9681"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%"><feGaussianBlur stdDeviation="15"/></filter>
  </defs>
  <rect width="1200" height="760" rx="34" fill="url(#wall)"/>
  <circle cx="950" cy="155" r="78" fill="#e6d5bd" opacity=".48"/>
  <path d="M0 545h1200v215H0z" fill="#e7ddcf"/>
  <path d="M0 545h1200" stroke="#d8cbbb" stroke-width="3"/>
  <ellipse cx="595" cy="630" rx="390" ry="35" fill="#655342" opacity=".16" filter="url(#shadow)"/>
  <!-- low upholstered seat -->
  <path d="M247 367q0-48 48-48h246q48 0 48 48v145H247z" fill="url(#fabric)"/>
  <path d="M224 420q0-34 34-34h30v133h-64zm349 0q0-34-34-34h-30v133h64z" fill="#a38d76"/>
  <path d="M278 391h112v88H278zm124 0h112v88H402z" fill="#d4c5b2" opacity=".82"/>
  <path d="M278 512v48m263-48v48" stroke="#554236" stroke-width="13" stroke-linecap="round"/>
  <!-- compact cabinet / sideboard -->
  <path d="M675 408h260v123H675z" fill="url(#wood)"/>
  <path d="M691 423h108v93H691zm120 0h108v93H811z" fill="#aa7e58" stroke="#75553f" stroke-width="3"/>
  <path d="M750 463h15m62 0h15" stroke="#e3c49a" stroke-width="7" stroke-linecap="round"/>
  <path d="M697 531v31m216-31v31" stroke="#594332" stroke-width="12" stroke-linecap="round"/>
  <!-- small occasional table -->
  <path d="M490 519h130q13 0 13 13v16H477v-16q0-13 13-13z" fill="#956c4d"/>
  <path d="M492 548v48m126-48v48" stroke="#694a34" stroke-width="9" stroke-linecap="round"/>
  <path d="M507 598h96" stroke="#694a34" stroke-width="8" stroke-linecap="round"/>
  <text x="600" y="694" text-anchor="middle" fill="#6d5947" font-family="Arial, sans-serif" font-size="22" letter-spacing="4">FURNIFLEX · FURNITURE PREVIEW</text>
</svg>
