<Directory /var/www/html/FurniFlex>
  Options -Indexes
  AllowOverride None
</Directory>
<DirectoryMatch "^/var/www/html/FurniFlex/(includes|storage|uploads/custom-requests)(/|$)">
  Require all denied
</DirectoryMatch>
<Directory /var/www/html/FurniFlex/uploads>
  <FilesMatch "(?i)\.(php[0-9]*|phtml|phar)$">
    Require all denied
  </FilesMatch>
</Directory>
