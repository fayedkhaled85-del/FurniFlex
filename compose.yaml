services:
  db:
    image: mariadb:10.11.16
    platform: linux/amd64
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    environment:
      MARIADB_DATABASE: ${DB_NAME:-furniflex_db}
      MARIADB_USER: ${DB_USER:-furniflex}
      MARIADB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD}
    volumes:
      - data:/var/lib/mysql
      - type: bind
        source: ./FurniFlex-Schema.sql
        target: /docker-entrypoint-initdb.d/01-furniflex.sql
        read_only: true
        bind:
          create_host_path: false
      - ./database/catalog.sql:/docker-entrypoint-initdb.d/02-catalog.sql:ro
    healthcheck:
      test: ["CMD","healthcheck.sh","--connect","--innodb_initialized"]
      interval: 5s
      timeout: 4s
      retries: 40
  app:
    image: furniflex-app:academic-1
    platform: linux/amd64
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      ADVISOR_ENDPOINT: http://advisor:8765/predict
      DB_HOST: db
      DB_NAME: ${DB_NAME:-furniflex_db}
      DB_USER: ${DB_USER:-furniflex}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8080}
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:80"
    volumes:
      - uploads:/var/www/html/FurniFlex/uploads
      - storage:/var/www/html/FurniFlex/storage
    healthcheck:
      test: ["CMD","php","/opt/furniflex/health.php"]
      interval: 10s
      timeout: 8s
      retries: 20
  advisor:
    build: ./ai-service
    environment:
      ADVISOR_BIND: 0.0.0.0
    healthcheck:
      test: ["CMD","python","-c","import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/health',timeout=3)"]
      interval: 10s
      timeout: 4s
      retries: 20
volumes:
  data:
  uploads:
  storage:

